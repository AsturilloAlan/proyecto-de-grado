{% extends "base.html" %}
{% block title %}Contraseña actualizada{% endblock %}
{% block content %}
    <div class="mx-auto text-center" style="max-width: 480px;">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
             style="width: 64px; height: 64px; background: #1a7f37; color: #fff;">
            <i class="bi bi-check-lg" style="font-size: 1.75rem;"></i>
        </div>
        <h1 class="text-guindo mb-2 h4">Contraseña actualizada</h1>
        <p class="text-secondary mb-4">Tu contraseña se cambió correctamente.</p>
        <a class="btn btn-guindo" href="{% url 'perfil' %}">
            <i class="bi bi-person-circle"></i> Volver a mi perfil
        </a>
    </div>
{% endblock %}
