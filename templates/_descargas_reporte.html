{% comment %}Conserva los filtros al exportar. sin_imprimir=True oculta el botón de impresión.{% endcomment %}
<div class="d-flex flex-wrap gap-2">
    <a class="btn btn-sm btn-guindo" href="?{% if request.GET.urlencode %}{{ request.GET.urlencode }}&amp;{% endif %}formato=pdf">
        <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
    </a>
    <a class="btn btn-sm btn-outline-guindo" href="?{% if request.GET.urlencode %}{{ request.GET.urlencode }}&amp;{% endif %}formato=excel">
        <i class="bi bi-file-earmark-spreadsheet"></i> Descargar Excel
    </a>
    {% if not sin_imprimir %}
        <button type="button" class="btn btn-sm btn-outline-secondary boton-imprimir-pdf"
                data-url="?{% if request.GET.urlencode %}{{ request.GET.urlencode }}&amp;{% endif %}formato=pdf&amp;en_linea=1">
            <i class="bi bi-printer"></i> Imprimir
        </button>
    {% endif %}
</div>
<script>
    // Descarga el PDF como blob y lo imprime desde un iframe oculto (mismo método que print-js).
    document.querySelectorAll(".boton-imprimir-pdf").forEach(function (boton) {
        boton.addEventListener("click", function () {
            var url = boton.dataset.url;
            var original = boton.innerHTML;
            boton.disabled = true;
            boton.innerHTML = '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Preparando…';
            fetch(url, { credentials: "same-origin" })
                .then(function (r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.blob();
                })
                .then(function (blob) {
                    var anterior = document.getElementById("marco-impresion");
                    if (anterior) anterior.remove();
                    var marco = document.createElement("iframe");
                    marco.id = "marco-impresion";
                    marco.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;";
                    marco.src = URL.createObjectURL(new Blob([blob], { type: "application/pdf" }));
                    marco.onload = function () {
                        // El visor de PDF necesita un momento para cargar antes de imprimir.
                        setTimeout(function () {
                            try {
                                marco.contentWindow.focus();
                                marco.contentWindow.print();
                            } catch (e) {
                                window.open(marco.src, "_blank");
                            }
                        }, 600);
                    };
                    document.body.appendChild(marco);
                })
                .catch(function () { window.open(url, "_blank"); })
                .finally(function () {
                    boton.disabled = false;
                    boton.innerHTML = original;
                });
        });
    });
</script>
